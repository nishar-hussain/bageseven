name: bagseven

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bagseven
      POSTGRES_PASSWORD: bagseven
      POSTGRES_DB: bagseven
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bagseven -d bagseven"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Docker creates named volumes as root; Foundry runs as UID 1000.
  # Prepare the mount before Anvil so periodic snapshots survive restarts.
  anvil-state-init:
    profiles: ["local-anvil"]
    image: ghcr.io/foundry-rs/foundry:stable
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 1000:1000 /data && chmod 700 /data"]
    volumes:
      - avalanche-anvil-data:/data
    restart: "no"

  anvil:
    profiles: ["local-anvil"]
    image: ghcr.io/foundry-rs/foundry:stable
    depends_on:
      anvil-state-init:
        condition: service_completed_successfully
    entrypoint: ["anvil"]
    command: ["--host", "0.0.0.0", "--chain-id", "43113", "--state", "/data/state.json", "--state-interval", "1"]
    ports:
      - "127.0.0.1:58545:8545"
    volumes:
      - avalanche-anvil-data:/data
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valkey-data:
  pgdata:
  avalanche-anvil-data:
