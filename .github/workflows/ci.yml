name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bagseven
          POSTGRES_PASSWORD: bagseven
          POSTGRES_DB: bagseven
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U bagseven -d bagseven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://bagseven:bagseven@localhost:55432/bagseven
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgres://bagseven:bagseven@localhost:55432/bagseven
